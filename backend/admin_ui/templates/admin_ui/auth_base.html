{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}ATELIER Admin{% endblock %}</title>
  <link rel="icon" type="image/jpeg" href="{% static 'images/favicon.jpg' %}">

  <!-- Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Icons: Phosphor -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --bg: #F7F7F5;
      --panel: #FFFFFF;
      --text: #181818;
      --text-secondary: #6B6B6B;
      --border: #E7E5E1;
      --accent: #4A5D4E;
      --accent-hover: #3C4A3F;
      --accent-soft: #EEF1ED;
      --status-success-bg: #E8F3EC;
      --status-success: #2E6A4F;
      --status-danger-bg: #FDF0F0;
      --status-danger: #C92A2A;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.08);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      color: var(--text);
      background:
        radial-gradient(900px 400px at 15% -10%, rgba(74, 93, 78, 0.08), transparent 60%),
        radial-gradient(900px 400px at 100% 10%, rgba(74, 93, 78, 0.06), transparent 60%),
        var(--bg);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .auth-shell {
      width: 100%;
      max-width: 420px;
    }

    .auth-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .auth-brand-mark {
      width: 34px;
      height: 34px;
      background: var(--text);
      color: #FFF;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 1px;
    }

    .auth-brand-title {
      font-weight: 700;
      font-size: 17px;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .auth-brand-badge {
      font-size: 10px;
      background: var(--border);
      color: var(--text-secondary);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .auth-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 32px;
    }

    .auth-title {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 4px 0;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .auth-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin: 0 0 24px 0;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }

    .form-label .required {
      color: var(--status-danger);
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--panel);
      font-family: var(--font-sans);
      font-size: 14px;
      color: var(--text);
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    select.form-control[multiple] {
      min-height: 120px;
      padding: 6px;
    }

    select.form-control[multiple] option {
      padding: 6px 8px;
      border-radius: 4px;
    }

    .form-check {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid #F0EFEA;
    }

    .form-check input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin-top: 2px;
      accent-color: var(--accent);
      flex-shrink: 0;
    }

    .form-check-group {
      flex: 1;
    }

    .form-check-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin: 0;
    }

    .form-check-group label + .form-check-text {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .form-text {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    .form-error {
      font-size: 12px;
      color: var(--status-danger);
      margin-top: 6px;
    }

    .errorlist {
      list-style: none;
      margin: 0 0 6px 0;
      padding: 0;
      font-size: 12px;
      color: var(--status-danger);
    }

    .errorlist li { margin-bottom: 2px; }

    .auth-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
      font-family: var(--font-sans);
      border: 1px solid transparent;
    }

    .btn-primary {
      background: var(--accent);
      color: #FFF;
      box-shadow: var(--shadow-sm);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      color: #FFF;
    }

    .btn-secondary {
      background: var(--panel);
      color: var(--text);
      border-color: var(--border);
      box-shadow: var(--shadow-sm);
    }

    .btn-secondary:hover {
      background: #F9F9F9;
      border-color: #D6D5D0;
    }

    .auth-footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 20px;
    }

    .auth-footer a {
      color: var(--accent);
      font-weight: 500;
      text-decoration: none;
    }

    .auth-footer a:hover { color: var(--accent-hover); }

    .alert {
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      margin-bottom: 18px;
      font-size: 13px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .alert-success { background: var(--status-success-bg); color: var(--status-success); border: 1px solid #B8E6CE; }
    .alert-error, .alert-danger { background: var(--status-danger-bg); color: var(--status-danger); border: 1px solid #F8B4B4; }

    .help-icon {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0 6px;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <div class="auth-shell">
    <div class="auth-brand">
      <div class="auth-brand-mark">A</div>
      <div class="auth-brand-title">ATELIER</div>
      <div class="auth-brand-badge">ADMIN</div>
    </div>

    <div class="auth-card">
      {% if messages %}
        {% for message in messages %}
          <div class="alert {% if message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %}" role="alert">
            <i class="ph ph-info"></i> <span>{{ message }}</span>
          </div>
        {% endfor %}
      {% endif %}

      {% block content %}{% endblock %}
    </div>

    <div class="auth-footer">
      {% block footer %}{% endblock %}
    </div>
  </div>
</body>
</html>
